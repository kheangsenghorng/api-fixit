name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Whitelist IP on Hostinger
        run: |
          curl -s -X POST "https://api.hostinger.com/v1/servers/ssh/whitelist" \
            -H "Authorization: Bearer ${{ secrets.HOSTINGER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ip": "${{ steps.ip.outputs.ipv4 }}"}'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 30s
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            cd ~/domains/servicemeite.io/public_html/fixit
            git fetch origin master
            git reset --hard origin/master
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            php artisan optimize
            echo "=== Done ==="